spring.application.name=variant-interpretation-api
server.port=8080

# BigQuery dataset backing variant search. Placeholder values: override with
# BIGQUERY_PROJECT_ID / BIGQUERY_DATASET_ID once the real dataset exists.
# Credentials always come from Application Default Credentials (gcloud ADC
# locally, the attached service account on a Verily Workbench VM).
bigquery.project-id=${BIGQUERY_PROJECT_ID:placeholder-project}
bigquery.dataset-id=${BIGQUERY_DATASET_ID:placeholder_dataset}