spring.application.name=variant-interpretation-api
server.port=8080

# BigQuery table backing variant search: 1,000 synthetic rows (see
# data/synthetic/), not real variant data. Override with BIGQUERY_PROJECT_ID /
# BIGQUERY_DATASET_ID / BIGQUERY_TABLE_ID once a real VAT table is available.
# Credentials always come from Application Default Credentials (gcloud ADC
# locally, the attached service account on a Verily Workbench VM).
bigquery.project-id=${BIGQUERY_PROJECT_ID:aou-via-dev}
bigquery.dataset-id=${BIGQUERY_DATASET_ID:foxtrot_synthetic}
bigquery.table-id=${BIGQUERY_TABLE_ID:v1}

# Participants in the cohort the table above was built from. Not a column in the
# VAT, but the denominator its cohort-wide allele numbers are counted over, so it
# has to be updated whenever the table is pointed somewhere else. The default is
# the synthetic table's cohort (data/synthetic/generate_vat_synthetic.py builds it
# from a 490,000-allele pool, i.e. 245,000 diploid samples).
bigquery.cohort-participants=${BIGQUERY_COHORT_PARTICIPANTS:245000}
