spring.application.name=variant-interpretation-api
server.port=8080

# BigQuery table backing variant search: 1,000 synthetic rows (see
# data/synthetic/), not real variant data. Override with BIGQUERY_PROJECT_ID /
# BIGQUERY_DATASET_ID / BIGQUERY_TABLE_ID once a real VAT table is available.
# Credentials always come from Application Default Credentials (gcloud ADC
# locally, the attached service account on a Verily Workbench VM).
bigquery.project-id=${BIGQUERY_PROJECT_ID:general-dev-billing-account}
bigquery.dataset-id=${BIGQUERY_DATASET_ID:foxtrot_syntethic}
bigquery.table-id=${BIGQUERY_TABLE_ID:v1}
