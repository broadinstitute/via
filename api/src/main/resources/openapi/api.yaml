openapi: 3.0.3
info:
  title: Variant Interpretation Backend API
  description: API for the All of Us Variant Interpretation Application.
  version: 0.1.0
servers:
  - url: /
paths:
  /api/profile:
    get:
      operationId: profile
      summary: Returns details about the current user
      tags:
        - profile
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /api/search:
    get:
      operationId: searchResults
      summary: Returns the candidate variant search results
      tags:
        - search
      parameters:
        - name: variants
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            Candidate variant IDs, VAT `vid` format (e.g. "8-11708582-C-T").
        - name: conditionConceptId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: >-
            The condition concept ID the user picked from /api/condition.
            There's deliberately no free-text alternative: re-searching typed
            text and choosing a match for the user could count a different
            concept than the one they meant. When absent, conditionSearch is
            null.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultsResponse"
  /api/condition:
    get:
      operationId: conditionCandidates
      summary: >-
        Returns condition concepts matching a free-text term
      description: >-
        This is used for a type-ahead when the user is entering a condition
        name. The results are ranked by estimated participant count, with
        concepts that have no estimate last.
      tags:
        - condition
      parameters:
        - name: condition
          in: query
          required: false
          schema:
            type: string
          description: >-
            Free-text condition name, e.g. "tetralogy of fallot".
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConditionCandidates"
  /api/sources:
    get:
      operationId: dataSourceVersions
      summary: >-
        Returns the version of each external dataset used to annotate and
        filter variants
      tags:
        - system
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSourceVersion"
  /api/status:
    get:
      operationId: bigQueryStatus
      summary: >-
        Reports whether the backend can read every BigQuery table it queries
        (the VAT table and the CDR's condition lookup tables) with its
        Application Default Credentials
      tags:
        - system
      responses:
        "200":
          description: >-
            The check ran. Note that a failed check is still a 200; see the
            `accessible` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BigQueryStatus"
components:
  schemas:
    BigQueryStatus:
      type: object
      required:
        - accessible
        - tables
      properties:
        accessible:
          type: boolean
          description: True when every table is accessible.
        tables:
          type: array
          description: Every table VIA queries, in the order they were checked.
          items:
            $ref: "#/components/schemas/TableStatus"
    TableStatus:
      type: object
      required:
        - table
        - accessible
      properties:
        table:
          type: string
          description: The table that was checked, as "project.dataset.table".
          example: "placeholder-project.placeholder_dataset.v1"
        accessible:
          type: boolean
          description: True when the table's metadata could be read.
        detail:
          type: string
          nullable: true
          description: Why the check failed. Null when accessible is true.
    UserProfile:
      type: object
      required:
        - userEmail
      properties:
        userEmail:
          type: string
          description: >-
            Email address of the Workbench user
          example: "researcher@example.org"
    DataSourceVersion:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          example: "gnomAD"
        version:
          type: string
          example: "v3.1.2"
        url:
          type: string
          nullable: true
    SearchResultsResponse:
      type: object
      required:
        - searchSummary
        - ancestryBreakdown
        - ageBreakdown
        - cohortVariants
        - filteredVariants
        - conditionSearch
      properties:
        searchSummary:
          $ref: "#/components/schemas/SearchSummary"
        conditionSearch:
          nullable: true
          description: >-
            Null when no conditionConceptId was given. Unlike the breakdowns
            and filteredVariants, this is backed by real queries against
            cb_criteria, concept_ancestor and condition_occurrence.
          allOf:
            - $ref: "#/components/schemas/ConditionSearch"
        ancestryBreakdown:
          description: >-
            Mock data: there's no participant-level data source behind it yet,
            so the groups are made up, as are ageBreakdown and filteredVariants.
            The counts do sum to conditionSearch.participantCount, the real
            count, and percent is each count's share of it. Empty unless that
            count is above zero; groups that round to nobody are left out.
          type: array
          items:
            $ref: "#/components/schemas/BreakdownSegment"
        ageBreakdown:
          description: Mock data, on the same participants as ancestryBreakdown.
          type: array
          items:
            $ref: "#/components/schemas/BreakdownSegment"
        cohortVariants:
          type: array
          items:
            $ref: "#/components/schemas/CohortVariant"
        filteredVariants:
          description: >-
            Mock data (see ancestryBreakdown), one entry per cohortVariants
            entry and in the same order, generated for a cohort of
            conditionSearch.participantCount participants. Empty when
            ancestryBreakdown is.
          type: array
          items:
            $ref: "#/components/schemas/FilteredVariant"
    SearchSummary:
      type: object
      required:
        - variantsRaw
        - variantsEnteredCount
        - variantsLimit
      properties:
        variantsRaw:
          type: string
          description: The raw, newline-separated candidate variants as entered.
        variantsEnteredCount:
          type: integer
        variantsLimit:
          type: integer
    ConditionCandidates:
      type: object
      required:
        - term
        - candidates
      properties:
        term:
          type: string
          description: >-
            The term as entered, trimmed, echoed back so a type-ahead can
            discard responses that arrive out of order.
          example: "tetralogy of fallot"
        candidates:
          description: >-
            Matching condition concepts, best first: exact name match, then
            estimatedParticipantCount descending, with concepts that have no
            estimate last. Empty when nothing matched, or when the term was
            blank.
          type: array
          items:
            $ref: "#/components/schemas/ConditionConcept"
    ConditionSearch:
      type: object
      required:
        - conceptId
        - concept
        - participantCount
      properties:
        conceptId:
          type: integer
          format: int64
          description: The concept ID that was requested.
          example: 9000010
        concept:
          nullable: true
          description: >-
            The requested concept. Null when conceptId isn't a standard
            condition concept in this CDR.
          allOf:
            - $ref: "#/components/schemas/ConditionConcept"
        participantCount:
          type: integer
          nullable: true
          description: >-
            Distinct participants having the concept or any of its
            descendants recorded in condition_occurrence. Null when concept
            is null. This is a real count, and will not match the concept's
            estimatedParticipantCount exactly.
          example: 49
    ConditionConcept:
      type: object
      required:
        - conceptId
        - name
      properties:
        conceptId:
          type: integer
          format: int64
          example: 9000010
        name:
          type: string
          example: "Tetralogy of Fallot"
        estimatedParticipantCount:
          type: integer
          nullable: true
          description: >-
            cb_criteria.est_count. An estimate, not a count -- it is what the
            ranking is based on, but participantCount is the real number. Null
            when the column was null or non-numeric; the real table also
            carries 0 and -1.
          example: 47
    BreakdownSegment:
      type: object
      required:
        - label
        - count
        - percent
        - color
      properties:
        label:
          type: string
        count:
          type: integer
          description: Number of phenotype-matched participants in this segment.
        percent:
          type: number
        color:
          type: string
          description: Hex color used to render this segment.
          example: "#F9C854"
    CohortVariant:
      type: object
      required:
        - variant
        - annotated
      properties:
        variant:
          type: string
          example: "8-11708582-C-T"
        gene:
          type: string
          nullable: true
        annotated:
          type: boolean
          description: >-
            False when this variant is in no annotation or frequency source at
            all; every other field below is only meaningful when true.
        classification:
          type: string
          nullable: true
          example: "Missense"
        proteinChange:
          type: string
          nullable: true
          example: "p.Arg115Cys"
        aouSubpopulation:
          type: string
          nullable: true
          enum: [EUR, AFR, AMR, EAS, SAS, MID, OTH]
        aouAf:
          type: number
          nullable: true
        aouAc:
          type: integer
          nullable: true
        aouAn:
          type: integer
          nullable: true
        aouPopulations:
          description: One entry per AoU subpopulation, for the expanded row's frequency table.
          type: array
          items:
            $ref: "#/components/schemas/PopulationFrequency"
        aouAllAf:
          type: number
          nullable: true
        aouAllAc:
          type: integer
          nullable: true
        aouAllAn:
          type: integer
          nullable: true
        gnomadSubpopulation:
          type: string
          nullable: true
          enum: [AFR, AMR, EAS, FIN, NFE, ASJ, OTH, SAS]
        gnomadAf:
          type: number
          nullable: true
        gnomadAc:
          type: integer
          nullable: true
        gnomadAn:
          type: integer
          nullable: true
        gnomadUrl:
          type: string
          nullable: true
        gnomadPopulations:
          description: One entry per gnomAD subpopulation, for the expanded row's frequency table.
          type: array
          items:
            $ref: "#/components/schemas/PopulationFrequency"
        gnomadAllAf:
          type: number
          nullable: true
        gnomadAllAc:
          type: integer
          nullable: true
        gnomadAllAn:
          type: integer
          nullable: true
        clinvarSignificance:
          type: string
          nullable: true
          enum: [Pathogenic, Likely pathogenic, VUS, Likely benign, Benign]
        clinvarUrl:
          type: string
          nullable: true
        clinvarStars:
          type: integer
          nullable: true
          minimum: 0
          maximum: 4
          description: >-
            ClinVar review status, as its 0-4 gold-star rating -- the max
            across this variant's RCV records. Null when there's no ClinVar
            record at all.
        clinvarHasConflicts:
          type: boolean
          description: >-
            True when this variant's own ClinVar RCV submissions disagree
            with each other. Meaningless when clinvarSignificance is null.
        clinvarConditions:
          type: array
          items:
            type: string
        clinvarLastUpdated:
          type: string
          format: date
          nullable: true
          description: >-
            When this variant's ClinVar record was last updated -- not necessarily the date its
            clinical significance was last evaluated, which the VAT doesn't separately provide.
        clinvarSubmissions:
          description: >-
            One entry per ClinVar RCV record for this variant, for the
            expanded row's ClinVar detail. There's no submitter identity in
            the underlying VAT, so each entry is keyed by its RCV accession
            instead of a lab/submitter name.
          type: array
          items:
            $ref: "#/components/schemas/ClinvarSubmission"
        spliceAi:
          type: number
          nullable: true
        plof:
          type: string
          nullable: true
          description: >-
            LOFTEE's predicted loss-of-function call: "HC" (high confidence)
            or "LC" (low confidence; see plofFilters for why). Null means
            either "not scored by LOFTEE" (when annotated) or n/a (when not
            annotated).
          enum: [HC, LC]
        plofFilters:
          description: >-
            LOFTEE's reasons for an LC call, as its own codes (e.g.
            END_TRUNC, NON_CAN_SPLICE). Empty unless plof is set.
          type: array
          items:
            type: string
        plofFlags:
          description: >-
            LOFTEE's warnings on a call, as its own codes (e.g. SINGLE_EXON,
            PHYLOCSF_WEAK). Can accompany HC as well as LC. Empty unless plof
            is set.
          type: array
          items:
            type: string
    FilteredVariant:
      type: object
      required:
        - variant
        - hasStats
      properties:
        variant:
          type: string
          example: "8-11708582-C-T"
        gene:
          type: string
          nullable: true
        classification:
          type: string
          nullable: true
          description: >-
            Some variants have consequence annotation even when
            phenotype-filtered cohort stats don't exist yet.
        hasStats:
          type: boolean
          description: >-
            False when phenotype-filtered cohort stats aren't available --
            currently, when the variant has no cohort-wide All of Us
            frequency to derive them from. The numeric fields below are only
            meaningful when true.
        cohortAc:
          type: integer
          nullable: true
        cohortAn:
          type: integer
          nullable: true
        cohortAf:
          type: number
          nullable: true
        homozygotes:
          type: integer
          nullable: true
        heterozygotes:
          type: integer
          nullable: true
        clinvarPlpInTrans:
          type: integer
          nullable: true
        afRatio:
          type: number
          nullable: true
    PopulationFrequency:
      type: object
      required:
        - population
      properties:
        population:
          type: string
          example: "AFR"
        af:
          type: number
          nullable: true
        ac:
          type: integer
          nullable: true
        an:
          type: integer
          nullable: true
    ClinvarSubmission:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: ClinVar RCV accession.
          example: "RCV000041652"
        classification:
          type: string
          nullable: true
          description: This submission's own classification, verbatim from ClinVar.
        stars:
          type: integer
          nullable: true
          minimum: 0
          maximum: 4
