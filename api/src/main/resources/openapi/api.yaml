openapi: 3.0.3
info:
  title: Variant Interpretation Backend API
  description: API for the variant interpretation application.
  version: 0.1.0
servers:
  - url: /
paths:
  /api/profile:
    get:
      operationId: profile
      summary: Returns details about the current Workbench user.
      tags:
        - profile
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /api/search-results:
    get:
      operationId: searchResults
      summary: >-
        Returns the candidate variant search results. When `variants` is
        given, each one is looked up in the configured VAT table by `vid`
        (in the order given); anything not found there comes back as an
        `annotated: false` row rather than being dropped. Without `variants`,
        returns a default browse listing instead. The phenotype-derived
        sections (crosswalk, breakdowns, phenotype-matched table) are still
        illustrative and not affected by either parameter.
      tags:
        - searchResults
      parameters:
        - name: variants
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >-
            Candidate variant IDs, VAT `vid` format (e.g. "8-11708582-C-T").
        - name: hpoTerm
          in: query
          required: false
          schema:
            type: string
          description: >-
            HPO phenotype term. Currently echoed back in the response for
            display only -- it doesn't yet filter anything.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultsResponse"
  /api/data-source-versions:
    get:
      operationId: dataSourceVersions
      summary: >-
        Returns the version of each external dataset used to annotate and
        filter variants, for display in the data-provenance widget.
      tags:
        - dataSourceVersions
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSourceVersion"
  /api/bigquery-status:
    get:
      operationId: bigQueryStatus
      summary: >-
        Reports whether the backend can reach the configured BigQuery dataset
        with its Application Default Credentials. A smoke test for deployment,
        not a health check for the service itself.
      tags:
        - bigQueryStatus
      responses:
        "200":
          description: >-
            The check ran. Note that a failed check is still a 200; see the
            `accessible` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BigQueryStatus"
components:
  schemas:
    BigQueryStatus:
      type: object
      required:
        - accessible
        - dataset
      properties:
        accessible:
          type: boolean
          description: True when the dataset's metadata could be read.
        dataset:
          type: string
          description: The dataset that was checked, as "project:dataset".
          example: "placeholder-project:placeholder_dataset"
        detail:
          type: string
          nullable: true
          description: Why the check failed. Null when accessible is true.
    UserProfile:
      type: object
      required:
        - userEmail
      properties:
        userEmail:
          type: string
          description: >-
            Email address of the Workbench user
          example: "researcher@example.org"
    DataSourceVersion:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          example: "gnomAD"
        version:
          type: string
          example: "v3.1.2"
        url:
          type: string
          nullable: true
    SearchResultsResponse:
      type: object
      required:
        - searchSummary
        - phenotypeCrosswalk
        - ancestryBreakdown
        - ageBreakdown
        - cohortVariants
        - filteredVariants
      properties:
        searchSummary:
          $ref: "#/components/schemas/SearchSummary"
        phenotypeCrosswalk:
          $ref: "#/components/schemas/PhenotypeCrosswalk"
        ancestryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownSegment"
        ageBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownSegment"
        cohortVariants:
          type: array
          items:
            $ref: "#/components/schemas/CohortVariant"
        filteredVariants:
          type: array
          items:
            $ref: "#/components/schemas/FilteredVariant"
    SearchSummary:
      type: object
      required:
        - variantsRaw
        - variantsEnteredCount
        - variantsLimit
        - hpoTerm
      properties:
        variantsRaw:
          type: string
          description: The raw, newline-separated candidate variants as entered.
        variantsEnteredCount:
          type: integer
        variantsLimit:
          type: integer
        hpoTerm:
          type: string
    PhenotypeCrosswalk:
      type: object
      required:
        - hpoCode
        - omopCode
        - description
        - participantCount
      properties:
        hpoCode:
          type: string
          example: "HP:0001636"
        omopCode:
          type: string
          example: "313867"
        description:
          type: string
          example: "Tetralogy of Fallot"
        participantCount:
          type: integer
    BreakdownSegment:
      type: object
      required:
        - label
        - count
        - percent
        - color
      properties:
        label:
          type: string
        count:
          type: integer
          description: Number of phenotype-matched participants in this segment.
        percent:
          type: number
        color:
          type: string
          description: Hex color used to render this segment.
          example: "#F9C854"
    CohortVariant:
      type: object
      required:
        - variant
        - annotated
      properties:
        variant:
          type: string
          example: "8-11708582-C-T"
        gene:
          type: string
          nullable: true
        annotated:
          type: boolean
          description: >-
            False when this variant is in no annotation or frequency source at
            all; every other field below is only meaningful when true.
        classification:
          type: string
          nullable: true
          example: "Missense"
        proteinChange:
          type: string
          nullable: true
          example: "p.Arg115Cys"
        aouSubpopulation:
          type: string
          nullable: true
          enum: [EUR, AFR, AMR, EAS, SAS, MID, OTH]
        aouAf:
          type: number
          nullable: true
        aouAc:
          type: integer
          nullable: true
        aouAn:
          type: integer
          nullable: true
        gnomadSubpopulation:
          type: string
          nullable: true
          enum: [AFR, AMR, EAS, FIN, NFE, ASJ, OTH, SAS]
        gnomadAf:
          type: number
          nullable: true
        gnomadAc:
          type: integer
          nullable: true
        gnomadAn:
          type: integer
          nullable: true
        gnomadUrl:
          type: string
          nullable: true
        clinvarSignificance:
          type: string
          nullable: true
          enum: [Pathogenic, VUS, Benign]
        clinvarUrl:
          type: string
          nullable: true
        spliceAi:
          type: number
          nullable: true
        plof:
          type: string
          nullable: true
          description: >-
            "HC" (high-confidence LOF) or null. Null means either "not
            scored by LOFTEE" (when annotated) or n/a (when not annotated).
          enum: [HC]
    FilteredVariant:
      type: object
      required:
        - variant
        - hasStats
      properties:
        variant:
          type: string
          example: "8-11708582-C-T"
        gene:
          type: string
          nullable: true
        classification:
          type: string
          nullable: true
          description: >-
            Some variants have consequence annotation even when
            phenotype-filtered cohort stats don't exist yet.
        hasStats:
          type: boolean
          description: >-
            False when phenotype-filtered cohort stats aren't available;
            the numeric fields below are only meaningful when true.
        cohortAc:
          type: integer
          nullable: true
        cohortAn:
          type: integer
          nullable: true
        cohortAf:
          type: number
          nullable: true
        homozygotes:
          type: integer
          nullable: true
        heterozygotes:
          type: integer
          nullable: true
        clinvarPlpInTrans:
          type: integer
          nullable: true
        afRatio:
          type: number
          nullable: true
