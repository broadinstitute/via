name: UI tests

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node:22-alpine build stage in deploy/Dockerfile.
          # jsdom 30 (via vitest) requires Node >= 22; it calls
          # worker_threads.markAsUncloneable, which Node 20 does not export.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Runs the same test suite as `npm run test`, plus enforces the coverage floors configured
      # in vite.config.ts (test.coverage.thresholds) and fails the job if coverage regresses below them
      - run: npm run coverage
      - name: Add coverage summary
        if: always()
        working-directory: ui
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (label, m) => `| ${label} | ${m.pct}% | ${m.covered}/${m.total} |`;
            console.log("### UI test coverage\n");
            console.log("| Metric | Coverage | Covered/Total |");
            console.log("|---|---|---|");
            console.log(row("Statements", s.statements));
            console.log(row("Branches", s.branches));
            console.log(row("Functions", s.functions));
            console.log(row("Lines", s.lines));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-report
          path: ui/coverage/
          retention-days: 14
