name: UI tests

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node:20-alpine build stage in deploy/Dockerfile.
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Runs the same test suite as `npm run test`, plus enforces the coverage floors configured
      # in vite.config.ts (test.coverage.thresholds) -- fails the job if coverage regresses below
      # them, so this replaces the plain test run rather than running the suite twice.
      - run: npm run coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage-report
          path: ui/coverage/
          retention-days: 14
