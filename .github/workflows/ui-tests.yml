name: UI tests

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the node:20-alpine build stage in deploy/Dockerfile.
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run test
