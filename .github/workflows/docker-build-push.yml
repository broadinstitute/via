name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/docker-build-push.yml"
  pull_request:
    paths:
      - "api/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/docker-build-push.yml"

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: dsp-artifact-registry
  REPOSITORY: via
  IMAGE: via

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Pushes to main publish `:latest` and `:<sha>`. Pull requests from branches in this
      # repo publish `:<branch>` and `:<sha>` so the branch can be trialled in Workbench
      # before merging (point deploy/docker-compose.yaml at the branch tag on that branch,
      # and revert to `:latest` before merging). PRs from forks can't use the workload
      # identity provider, so they only validate that the image builds.
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        id: auth
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/1038484894585/locations/global/workloadIdentityPools/github-wi-pool/providers/github-wi-provider"
          service_account: "dsp-artifact-registry-push@dsp-artifact-registry.iam.gserviceaccount.com"

      - name: Log in to Artifact Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Determine image tags
        id: meta
        if: env.PUBLISH == 'true'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_REF}:${GITHUB_SHA}"
            if [[ "${EVENT_NAME}" == "push" ]]; then
              echo "${IMAGE_REF}:latest"
            else
              # GITHUB_HEAD_REF is the PR's source branch. Docker tags allow only
              # [A-Za-z0-9_.-], so anything else (e.g. "/") becomes "-".
              echo "${IMAGE_REF}:${GITHUB_HEAD_REF//[^A-Za-z0-9_.-]/-}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Build context is the repo root -- see the comment atop deploy/Dockerfile.
          context: .
          file: deploy/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
