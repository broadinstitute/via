name: Build and push Docker image

on:
  push:
    # main publishes :latest. Any other branch listed here publishes an image tagged with the
    # branch name (slashes become dashes), for trying a branch out in Workbench before merge:
    # point deploy/docker-compose.yaml at that tag, and remove both when the branch merges.
    branches: [main, mb-via-76]
    paths:
      - "api/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/docker-build-push.yml"
  pull_request:
    paths:
      - "api/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/docker-build-push.yml"

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: dsp-artifact-registry
  REPOSITORY: via
  IMAGE: via

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # PR runs only validate that the image builds -- they never authenticate
      # to GCP or push, so a PR can't publish an image before it's merged. Only
      # pushes to the branches listed above publish.
      - name: Authenticate to Google Cloud
        id: auth
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/1038484894585/locations/global/workloadIdentityPools/github-wi-pool/providers/github-wi-provider"
          service_account: "dsp-artifact-registry-push@dsp-artifact-registry.iam.gserviceaccount.com"

      - name: Log in to Artifact Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Determine image tags
        id: meta
        if: github.event_name == 'push'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            MOVING_TAG="latest"
          else
            MOVING_TAG="$(tr '/' '-' <<< "${GITHUB_REF_NAME}")"
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE_REF}:${{ github.sha }}"
            echo "${IMAGE_REF}:${MOVING_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Build context is the repo root -- see the comment atop deploy/Dockerfile.
          context: .
          file: deploy/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
