name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/docker-build-push.yml"
  pull_request:
    paths:
      - "api/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/docker-build-push.yml"
  # Run by hand (Actions > Build and push Docker image > Run workflow) to publish a branch so it
  # can be trialled in Workbench before merging. The image is tagged `:<branch>` and `:<sha>`,
  # never `:latest`.
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build and push. Leave empty to use the branch selected in Run workflow."
        required: false
        type: string

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: dsp-artifact-registry
  REPOSITORY: via
  IMAGE: via

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Pushes to main publish `:latest` and `:<sha>`; a manual run publishes `:<branch>` and
      # `:<sha>`. Pull requests only validate that the image builds -- they never authenticate
      # to GCP or push, so a PR can't publish an image before it's merged.
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      # The branch a manual run builds: the input if given, else the ref the run was started
      # from. Empty for the other events, which build the commit that triggered them.
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && (inputs.branch || github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        id: auth
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/1038484894585/locations/global/workloadIdentityPools/github-wi-pool/providers/github-wi-provider"
          service_account: "dsp-artifact-registry-push@dsp-artifact-registry.iam.gserviceaccount.com"

      - name: Log in to Artifact Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Determine image tags
        id: meta
        if: env.PUBLISH == 'true'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}
        run: |
          # The checked-out commit, not github.sha: a manual run given a branch input builds
          # that branch's head, which github.sha (the ref the run was started from) isn't.
          sha="$(git rev-parse HEAD)"
          {
            echo "tags<<EOF"
            echo "${IMAGE_REF}:${sha}"
            if [[ -z "${BRANCH}" ]]; then
              echo "${IMAGE_REF}:latest"
            else
              # Docker tags allow only [A-Za-z0-9_.-], so anything else (e.g. "/") becomes "-".
              echo "${IMAGE_REF}:${BRANCH//[^A-Za-z0-9_.-]/-}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Build context is the repo root -- see the comment atop deploy/Dockerfile.
          context: .
          file: deploy/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
