name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/docker-build-push.yml"
  pull_request:
    paths:
      - "api/**"
      - "ui/**"
      - "deploy/**"
      - ".github/workflows/docker-build-push.yml"

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: dsp-artifact-registry
  REPOSITORY: via
  IMAGE: via

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/1038484894585/locations/global/workloadIdentityPools/github-wi-pool/providers/github-wi-provider"
          service_account: "dsp-artifact-registry-push@dsp-artifact-registry.iam.gserviceaccount.com"

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Determine image tags
        id: meta
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXTRA_TAG="pr-${{ github.event.pull_request.number }}"
          else
            EXTRA_TAG="latest"
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE_REF}:${{ github.sha }}"
            echo "${IMAGE_REF}:${EXTRA_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root -- see the comment atop deploy/Dockerfile.
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
