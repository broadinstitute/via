name: API tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      # `check` runs `test`, then (via finalizedBy/dependsOn in build.gradle) jacocoTestReport
      # and jacocoTestCoverageVerification. the latter fails the build if coverage regresses
      # below the floor configured there
      - run: ./gradlew --no-daemon check
      - name: Add coverage summary
        if: always()
        working-directory: api
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          counters = {c.get("type"): c for c in root.findall("counter")}
          def row(label, key):
              c = counters.get(key)
              if c is None:
                  return f"| {label} | n/a | n/a |"
              covered, missed = int(c.get("covered")), int(c.get("missed"))
              total = covered + missed
              pct = round(100 * covered / total, 2) if total else 0
              return f"| {label} | {pct}% | {covered}/{total} |"
          print("### API test coverage\n")
          print("| Metric | Coverage | Covered/Total |")
          print("|---|---|---|")
          print(row("Lines", "LINE"))
          print(row("Branches", "BRANCH"))
          print(row("Methods", "METHOD"))
          print(row("Classes", "CLASS"))
          print()
          print("_Excludes OpenAPI-generated interfaces/models._")
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-report
          path: api/build/reports/jacoco/test/html/
          retention-days: 14
